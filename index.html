<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Precision Command Battle</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#0d1117;color:#f0f6fc;font-family:'Hiragino Sans','Noto Sans JP',sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{max-width:512px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:#0f172a;border:1px solid #334155}
#target{position:absolute;border-radius:50%;transform:translate(-50%,-50%);border:3px solid #ef4444;background:rgba(239,68,68,.15)}
#target .in{position:absolute;inset:17%;border-radius:50%;border:2px dashed #f59e0b;background:rgba(245,158,11,.25)}
#target .bull{position:absolute;inset:33%;border-radius:50%;background:#22c55e;box-shadow:0 0 10px #22c55e}
.act{animation:p 1.2s infinite ease-in-out}
@keyframes p{50%{box-shadow:0 0 18px #22d3ee}}
button:disabled{opacity:.35}
@keyframes fl{50%{transform:translateY(-4px)}}
.shk{animation:shk .35s}
@keyframes shk{20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(4px,2px)}}
.fxo{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;z-index:5}
.fxr{position:absolute;inset:0;pointer-events:none;border-radius:12px;animation:fd .5s forwards}
@keyframes fd{to{opacity:0}}
.ring{width:20px;height:20px;border-radius:50%;border:4px solid var(--c);box-shadow:0 0 16px var(--c);animation:rg .5s ease-out forwards}
@keyframes rg{to{transform:scale(5);opacity:0}}
.slash{position:absolute;width:90px;height:4px;background:linear-gradient(90deg,transparent,#fff,var(--c),transparent);box-shadow:0 0 12px var(--c);animation:sl .3s ease-out both}
@keyframes sl{0%{transform:rotate(var(--r,-35deg)) scaleX(0)}50%{transform:rotate(var(--r,-35deg)) scaleX(1)}100%{transform:rotate(var(--r,-35deg)) scaleX(1);opacity:0}}
.beam{position:absolute;top:-90px;width:14px;height:170px;background:linear-gradient(#fff,var(--c));box-shadow:0 0 20px var(--c);transform-origin:top;animation:bm .45s forwards}
@keyframes bm{from{transform:scaleY(0)}40%{transform:scaleY(1)}to{opacity:0}}
.fxd{position:absolute;top:0;font-weight:900;color:#fde68a;text-shadow:0 0 8px #000,0 0 12px var(--c);animation:fu 1s forwards;z-index:6;white-space:nowrap}
@keyframes fu{to{transform:translateY(-40px);opacity:0}}
.dying{animation:dy .6s .3s forwards}
@keyframes dy{to{opacity:0;transform:scale(.3) rotate(20deg)}}
.orbw{position:relative;width:110px;height:110px;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.orb{width:80px;height:80px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--c) 45%,#1e1b4b);box-shadow:0 0 40px var(--c),0 0 80px var(--c);animation:orb 1.9s ease-in forwards}
@keyframes orb{0%{transform:scale(.3)}30%{transform:scale(1)}40%,60%,80%{transform:scale(1) translateX(-5px)}50%,70%,90%{transform:scale(1.1) translateX(5px)}100%{transform:scale(1.6)}}
.orbring{position:absolute;inset:0;border-radius:50%;border:3px dashed var(--c);animation:spn 1s linear infinite}
@keyframes spn{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:scale(0) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
</style>
</head>
<body>
<div id="app">
  <div id="hd" class="flex justify-between items-center px-3 py-2 bg-slate-950 border-b border-slate-800 text-sm"></div>
  <div id="main" class="flex-1 overflow-y-auto"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const EL={fire:['火','text-red-400'],water:['水','text-sky-400'],wind:['風','text-green-400'],light:['光','text-yellow-300']};
const star=r=>'<span class="text-amber-400 text-xs">'+'★'.repeat(r)+'</span>';
const CH=[
{id:'kazuma',n:'カズマ',r:3,e:'fire',i:'🧙',hp:480,atk:140,df:35,p:'全ての攻撃が敵全体にヒット',u:['チーム覚醒','次ターン全員ATK+30%','BUFF'],mx:300},
{id:'blaze',n:'レイジ',r:2,e:'fire',i:'🔥',hp:400,atk:120,df:30,p:'火属性ATK+20%',u:['ターゲット拡大','的が1.5倍になる','BIG'],mx:300},
{id:'aqua',n:'セリーナ',r:2,e:'water',i:'💧',hp:350,atk:95,df:40,p:'高い防御力',u:['クロノ・スロー','的の速度が半分','SLOW'],mx:300},
{id:'zephyr',n:'ハヤテ',r:1,e:'wind',i:'🌪️',hp:320,atk:110,df:25,p:'風の機動力',u:['エイムアシスト','中心判定を拡大','BULL'],mx:280},
{id:'lumia',n:'エレナ',r:1,e:'light',i:'☀️',hp:450,atk:85,df:50,p:'毎ターンHP自動回復',u:['タイムブースト','連射+2秒','TIME'],mx:320},
{id:'ignis',n:'ヴァルカン',r:2,e:'fire',i:'☄️',hp:500,atk:135,df:20,p:'火属性ATK+20%',u:['爆風領域','的が1.5倍になる','BIG'],mx:350},
{id:'sylph',n:'ライカ',r:1,e:'wind',i:'🍃',hp:340,atk:105,df:28,p:'風の加護',u:['エイムアシスト','中心判定を拡大','BULL'],mx:280}];
// [name,rarity,atk,hp,def,icon]
const GR=[['標準スコープ',1,15,0,0,'🎯'],['簡易アーマー',1,0,120,10,'🛡️'],['小型セル',1,10,60,5,'🔋'],
['レーザーサイト',2,45,0,15,'👁️'],['チタンプレート',2,0,350,30,'🔰'],['ハイパワーセル',2,30,180,15,'⚡'],
['フォトンコア',3,90,250,25,'⚛️'],['イージスシステム',3,25,750,60,'🔷'],['超神撃ドライブ',3,120,150,15,'💥']];
const gd=g=>[g[2]&&'ATK+'+g[2],g[3]&&'HP+'+g[3],g[4]&&'DEF+'+g[4]].filter(Boolean).join(' ');
const en=(n,h,a,i)=>[n,h,a,i||'🤖'];
const Q=[
{id:'m1',t:'main',n:'1-1 静寂の廃都市',exp:200,en:80,co:300,w:[[en('ドローンA',500,35,'🛸'),en('ドローンB',500,35,'🛸')],[en('ガードロボ',900,50),en('ドローンC',500,35,'🛸')],[en('VX-9000',2500,85,'🦾')]]},
{id:'m2',t:'main',n:'1-2 氷結のデータプラント',exp:450,en:180,co:600,w:[[en('アイスビットα',800,45,'🧊'),en('アイスビットβ',800,45,'🧊')],[en('クリスタルガード',1500,65,'💠'),en('アイスビットγ',800,45,'🧊')],[en('フロスト・ドローン',4000,120,'❄️')]]},
{id:'m3',t:'main',n:'1-3 暴風の軌道エレベータ',exp:900,en:350,co:1200,w:[[en('スワームA',1000,60,'🐛'),en('スワームB',1000,60,'🐛'),en('スワームC',1000,60,'🐛')],[en('センチネル',2200,90,'🌀'),en('センチネル',2200,90,'🌀')],[en('ストーム要塞X',6500,160,'🏰')]]},
{id:'e1',t:'energy',n:'エナジー収集 初級',exp:80,en:400,co:200,w:[[en('シーカーA',600,30,'⚡'),en('シーカーB',600,30,'⚡')],[en('オートマトン',2000,60)]]},
{id:'e2',t:'energy',n:'エナジー収集 上級',exp:150,en:1500,co:500,w:[[en('ガーディアンA',1800,70,'🧱'),en('ガーディアンB',1800,70,'🧱')],[en('マザーコア',7000,150,'🔆')]]},
{id:'g1',t:'gear',n:'ギア獲得 初級試練',exp:120,en:60,co:300,gp:[.75,.25,0],w:[[en('パトロールA',750,40),en('パトロールB',750,40)],[en('重装ガード',2400,80,'🦿')]]},
{id:'g2',t:'gear',n:'ギア獲得 上級試練',exp:300,en:120,co:800,gp:[.2,.5,.3],w:[[en('センチネルA',1800,80),en('センチネルB',1800,80)],[en('マスタータイタン',9000,180,'🗿')]]}];

let U={en:300,co:1000,chars:CH.slice(0,4).map(c=>({id:c.id,lv:1,exp:0,sk:1,sh:0})),party:['kazuma','blaze','aqua','zephyr'],gears:[],tr:'kazuma',tab:'main',gm:0,res:null,
ms:[{t:'クエストを1回クリアする',c:500,p:0,cl:0},{t:'ガチャを1回引く',c:300,p:0,cl:0},{t:'キャラを1回強化する',c:400,p:0,cl:0}]};
let B=null,R=null,sy=null;
const M=id=>CH.find(c=>c.id===id),O=id=>U.chars.find(c=>c.id===id);
function snd(n){try{if(!sy){Tone.start();sy=new Tone.Synth().toDestination()}sy.triggerAttackRelease(n,'16n')}catch(e){}}
function st(id){const m=M(id),o=O(id),k=1+(o.sk-1)*.1+Math.min(.2,Math.floor(Math.sqrt(o.bd||0))*.02),gi=U.gears.find(x=>x.eq===id),g=gi?GR[gi.g]:null;
 return{m,o,g,hp:Math.floor(m.hp*(1+(o.lv-1)*.12)*k)+(g?Math.round(g[3]*(1+.1*(gi.lv||0))):0),atk:Math.floor(m.atk*(1+(o.lv-1)*.1)*k)+(g?Math.round(g[2]*(1+.1*(gi.lv||0))):0),df:Math.floor(m.df*(1+(o.lv-1)*.08)*k)+(g?Math.round(g[4]*(1+.1*(gi.lv||0))):0),next:o.lv*100}}
function addExp(o,x){if(o.lv>=99)return;o.exp+=x;while(o.lv<99&&o.exp>=o.lv*100){o.exp-=o.lv*100;o.lv++}}
function mp(i){const m=U.ms[i];if(m&&!m.cl)m.p=1}

const V={};
V.home=()=>`<div class="p-4 space-y-3">
<div class="text-center bg-slate-950 border border-slate-800 rounded-2xl p-3"><div class="text-xl font-extrabold text-cyan-300 tracking-wider">PRECISION COMMAND</div><div class="text-xs text-slate-400">実力派エイムバトル</div></div>
<div class="bg-slate-950/60 border border-slate-800 rounded-xl p-2"><div class="flex justify-between text-xs mb-1"><b>編成パーティ</b><button class="text-cyan-400" onclick="show('party')">編集</button></div>
<div class="grid grid-cols-4 gap-1.5">${U.party.map(id=>{const m=M(id),o=O(id);return`<div class="bg-slate-900 border border-slate-700 rounded-xl p-1.5 text-center"><div>${star(m.r)}</div><div class="text-xl">${m.i}</div><div class="text-[10px] font-bold truncate">${m.n}</div><div class="text-[10px] text-cyan-400">Lv.${o.lv}</div></div>`}).join('')}</div></div>
<div class="grid grid-cols-2 gap-2 text-xs font-bold">
<button onclick="show('quest')" class="bg-indigo-900/70 border border-indigo-500/50 rounded-2xl p-4 active:scale-95">🗺️<br>出撃（クエスト）</button>
<button onclick="show('gacha')" class="bg-amber-900/50 border border-amber-500/60 rounded-2xl p-4 text-amber-200 active:scale-95">💎<br>ガチャ（★3カズマ）</button>
<button onclick="show('train')" class="bg-slate-900 border border-slate-700 rounded-2xl p-3 active:scale-95">🧬<br>キャラ育成</button>
<button onclick="show('mission')" class="bg-slate-900 border border-slate-700 rounded-2xl p-3 active:scale-95">📋<br>ミッション</button>
<button onclick="show('party')" class="bg-slate-900 border border-slate-800 rounded-xl p-2">🛡️ パーティ編成</button>
<button onclick="help()" class="bg-slate-900 border border-slate-800 rounded-xl p-2">❓ 遊び方</button></div></div>`;
const back=`<button onclick="show('home')" class="px-2.5 py-1 bg-slate-800 text-xs rounded-lg border border-slate-700">戻る</button>`;
const head=(t,c)=>`<div class="flex justify-between items-center mb-3"><h2 class="font-bold ${c}">${t}</h2>${back}</div>`;

V.gacha=()=>`<div class="p-4">${head('💎 スカウトガチャ','text-amber-400')}
<div class="bg-amber-950/50 border border-amber-500/50 rounded-2xl p-3 mb-3"><div class="text-xs text-amber-300 font-bold">PICK UP ★3 ／ 300コイン・1回</div>
<div class="text-lg font-extrabold text-amber-300">「カズマ」新登場！</div><div class="text-[11px] text-slate-300 mb-2">火属性。攻撃が常に敵全体にヒット。必殺技で全員ATK+30%。</div>
<div class="flex gap-2"><button onclick="draw(1)" class="flex-1 bg-amber-500 text-slate-950 font-bold py-2.5 rounded-xl text-xs">1回 (300)</button><button onclick="draw(10)" class="flex-1 bg-orange-600 font-bold py-2.5 rounded-xl text-xs">10連 (3000)</button></div></div>
<div class="flex justify-around text-center text-[10px] text-slate-400 bg-slate-950/60 border border-slate-800 rounded-xl p-2"><div><b class="text-amber-300 block">★3 10%</b>カズマ</div><div><b class="text-indigo-300 block">★2 30%</b></div><div><b class="text-slate-300 block">★1 60%</b></div></div>
${U.res?`<div class="grid grid-cols-3 gap-2 mt-3">${U.res.map(x=>`<div class="p-2 rounded-xl border bg-slate-900 text-center ${x.m.r==3?'border-amber-400':'border-slate-700'}"><div>${star(x.m.r)}</div><div class="text-xl">${x.m.i}</div><div class="text-xs font-bold truncate">${x.m.n}</div><div class="text-[9px] ${x.dup?'text-amber-300':'text-emerald-400'} font-bold">${x.dup?'欠片+10':'NEW!'}</div></div>`).join('')}</div>`:''}</div>`;
function draw(n){if(U.co<n*300){alert('コインが足りません！');return}
 U.co-=n*300;mp(1);U.res=[];
 for(let i=0;i<n;i++){const r=Math.random()*100,pool=r<10?[M('kazuma')]:r<40?CH.filter(c=>c.r==2):CH.filter(c=>c.r==1);
  const m=pool[Math.floor(Math.random()*pool.length)];let o=O(m.id),dup=!!o;
  if(o)o.sh+=10;else U.chars.push({id:m.id,lv:1,exp:0,sk:1,sh:0});U.res.push({m,dup})}
 show('gacha');gAnim()}

V.mission=()=>`<div class="p-4">${head('📋 デイリーミッション','text-indigo-400')}<div class="space-y-2">${U.ms.map((m,i)=>`<div class="bg-slate-950/80 border border-slate-800 p-3 rounded-xl flex justify-between items-center"><div><div class="text-xs font-bold">${m.t}</div><div class="text-[10px] text-amber-400">報酬 🪙${m.c}</div><div class="text-[10px] text-slate-400">進捗 ${m.p}/1</div></div><button onclick="claim(${i})" ${!m.p||m.cl?'disabled':''} class="px-3 py-1.5 rounded-lg text-xs font-bold ${m.p&&!m.cl?'bg-amber-500 text-slate-950':'bg-slate-800'}">${m.cl?'受取済':'受取'}</button></div>`).join('')}</div></div>`;
function claim(i){const m=U.ms[i];if(m.p&&!m.cl){m.cl=1;U.co+=m.c;snd('E5');show('mission')}}

V.quest=()=>`<div class="p-4">${head('🧭 クエスト選択','text-cyan-400')}
<div class="flex border-b border-slate-800 mb-3 text-xs">${[['main','メイン'],['energy','エナジー'],['gear','ギア獲得']].map(t=>`<button onclick="U.tab='${t[0]}';show('quest')" class="flex-1 py-2 font-bold border-b-2 ${U.tab==t[0]?'border-cyan-400 text-cyan-400':'border-transparent text-slate-400'}">${t[1]}</button>`).join('')}</div>
<div class="space-y-2.5">${Q.filter(q=>q.t==U.tab).map(q=>`<div class="bg-slate-950/80 border border-slate-800 p-3 rounded-xl flex justify-between items-center"><div><div class="text-xs font-bold">${q.n}</div><div class="text-[10px] text-slate-400">全${q.w.length}WAVE</div><div class="text-[10px] text-cyan-400">EXP+${q.exp} <span class="text-yellow-400">⚡+${q.en}</span> <span class="text-amber-400">🪙+${q.co}</span>${q.gp?' <span class="text-amber-300">⚙ギア</span>':''}</div></div><button onclick="start('${q.id}')" class="bg-cyan-600 text-xs font-bold px-3.5 py-2 rounded-lg active:scale-95">出撃</button></div>`).join('')}</div></div>`;

V.party=()=>`<div class="p-4">${head('🛡️ チーム編成','text-cyan-400')}<p class="text-[11px] text-slate-400 mb-2">最大4人まで（現在 ${U.party.length}人）</p>
<div class="grid grid-cols-2 gap-2">${U.chars.map(o=>{const m=M(o.id),on=U.party.includes(o.id);return`<div class="p-2.5 rounded-xl border flex justify-between items-center ${on?'bg-slate-900 border-cyan-500/60':'bg-slate-950 border-slate-700'}"><div class="flex items-center gap-2"><span class="text-lg">${m.i}</span><div><div class="text-xs font-bold ${EL[m.e][1]}">${m.n}</div><div class="text-[10px] text-slate-400">Lv.${o.lv}（${EL[m.e][0]}）</div></div></div><button onclick="tp('${o.id}')" class="text-xs font-bold ${on?'text-rose-400':'text-cyan-400'}">${on?'外す':'追加'}</button></div>`}).join('')}</div></div>`;
function tp(id){if(U.party.includes(id)){if(U.party.length>1)U.party=U.party.filter(x=>x!=id)}else if(U.party.length<4)U.party.push(id);show('party')}

V.train=()=>{const s=st(U.tr),m=s.m,o=s.o,mx=o.lv>=99,cost=o.lv*80,rq=o.sk*10,sm=o.sk>=5,pr=mx?100:Math.floor(o.exp/s.next*100);
 return`<div class="p-4">${head('🧬 キャラクター強化','text-amber-400')}
<div class="bg-slate-950/80 border border-slate-800 p-3 rounded-2xl mb-3 space-y-2">
<div class="flex justify-between"><div><div class="font-bold ${EL[m.e][1]}">${m.i} ${m.n} <span class="text-[10px] bg-amber-950 text-amber-300 border border-amber-500/50 px-1.5 rounded-full">凸Lv.${o.sk}</span></div><div class="text-xs text-cyan-400 font-bold">Lv.${o.lv}/99</div></div><div class="text-[10px] text-slate-400 text-right">パッシブ: ${m.p}<br>必殺: ${m.u[0]}</div></div>
<div><div class="flex justify-between text-[10px] text-slate-400"><span>EXP</span><span>${mx?'MAX':o.exp+'/'+s.next}</span></div><div class="h-2 bg-slate-950 rounded-full border border-slate-800 overflow-hidden"><div class="h-full bg-cyan-500" style="width:${pr}%"></div></div></div>
<div class="grid grid-cols-3 text-center bg-slate-900 p-2 rounded-xl text-xs"><div><span class="text-[10px] text-slate-400 block">HP</span><b class="text-emerald-400">${s.hp}</b></div><div><span class="text-[10px] text-slate-400 block">ATK</span><b class="text-rose-400">${s.atk}</b></div><div><span class="text-[10px] text-slate-400 block">DEF</span><b class="text-amber-400">${s.df}</b></div></div>
<div class="flex justify-between items-center bg-slate-900 border border-amber-500/30 p-2 rounded-xl"><div class="text-xs"><b>${s.g?s.g[5]+' '+s.g[0]:'⚙ ギア未装備'}</b><div class="text-[10px] text-amber-300">${s.g?gd(s.g):''}</div></div><button onclick="U.gm=!U.gm;show('train')" class="px-2.5 py-1 bg-amber-500 text-slate-950 font-bold rounded-lg text-[10px]">変更</button></div>
${U.gm?`<div class="bg-slate-900 border border-slate-700 rounded-xl p-2 space-y-1.5 max-h-52 overflow-y-auto">${U.gears.length?U.gears.map((g,i)=>{const d=GR[g.g],ot=g.eq&&g.eq!=U.tr;return`<button onclick="eq(${i})" class="w-full p-2 rounded-xl border flex justify-between items-center text-left ${g.eq==U.tr?'border-amber-400 bg-amber-950/50':'border-slate-800 bg-slate-950'}"><span class="text-xs"><b>${d[5]} ${d[0]}</b> ${star(d[1])}<br><span class="text-[10px] text-slate-400">${gd(d)}</span></span><span class="text-[10px] text-slate-400">${g.eq==U.tr?'装備中':ot?M(g.eq).n+'装備':'選択'}</span></button>`}).join(''):'<div class="text-xs text-slate-400 text-center py-3">ギアがありません。ギア獲得クエストで入手！</div>'}<button onclick="uneq()" class="w-full py-1.5 bg-rose-950 border border-rose-800 text-rose-300 rounded-xl text-xs font-bold">装備を外す</button></div>`:''}
<div class="flex justify-between items-center border-t border-slate-800 pt-2"><div class="text-xs"><span class="text-[10px] text-slate-400 block">レベル強化</span><b class="text-yellow-400">⚡${mx?'MAX':cost}</b></div><button onclick="lvUp()" ${mx||U.en<cost?'disabled':''} class="bg-cyan-600 font-bold px-3.5 py-1.5 rounded-xl text-xs">${mx?'MAX':'レベル強化'}</button></div>
